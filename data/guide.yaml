# Guide texts, keyed by step id. Rules are paraphrased; card effects are never described.
# Every text is given per language ({en: ..., de: ...}); lists of lines and confirms are given per language as a whole.
# Placeholders: {enemy} {speed} {actions} {left} {total} {dice_line} {legendary_line} {next_line}
steps:
  setup:
    actor: all
    short:
      en: "Deal 4 Upgrade cards to each player, resolve Start of Game abilities, then start."
      de: "Gebt jedem Spieler 4 Upgrade-Karten, handelt Spielbeginn-Fähigkeiten ab und startet dann."
    lines:
      en:
        - "Shuffle the physical Upgrade deck and deal 4 Upgrade cards to each player. Keep your hands secret: you may discuss strategy, but not your cards."
        - "Place your drafted Titans face up in front of you as your benches."
        - "Resolve Start of Game abilities on your Titans."
      de:
        - "Mischt den echten Upgrade-Stapel und gebt jedem Spieler 4 Upgrade-Karten. Haltet eure Hände geheim: Ihr dürft über Strategie sprechen, aber nicht über eure Karten."
        - "Legt eure gedrafteten Titanen offen als eure Bänke vor euch aus."
        - "Handelt die Spielbeginn-Fähigkeiten eurer Titanen ab."
    confirms:
      en: ["Confirm: Upgrade cards dealt", "Confirm: Titans placed"]
      de: ["Bestätigen: Upgrade-Karten verteilt", "Bestätigen: Titanen ausgelegt"]
    why:
      en: "The app plays the enemy. You handle your own Titans, tokens, and cards on the table."
      de: "Die App spielt den Gegner. Eure eigenen Titanen, Token und Karten verwaltet ihr am Tisch."
    primary: [[{en: "Start game", de: "Spiel starten"}, "begin_game", {}]]
    refs: [[{en: "Co-op: Game Setup", de: "Koop: Spielaufbau"}, "design/final-titan-coop-rules.md"]]
  fight_start_champion:
    actor: players
    short: ""
    lines:
      en:
        - "{enemy} is the enemy Champion. Decide together which player sends a Titan from their bench as Challenger."
        - "All players may play Upgrade cards face down for that Titan, then reveal them together."
        - "Resolve When Revealed effects, then Start of Fight abilities: the starting side first. Enemy Upgrades on the right count for the enemy."
        - "Enemy Speed is {speed}. Higher Speed starts; on a tie, your Challenger starts."
      de:
        - "{enemy} ist der gegnerische Champion. Entscheidet gemeinsam, welcher Spieler einen Titan von seiner Bank als Herausforderer schickt."
        - "Alle Spieler dürfen Upgrade-Karten verdeckt für diesen Titan spielen und sie dann gemeinsam aufdecken."
        - "Handelt „Beim Aufdecken“-Effekte ab, dann „Kampfbeginn“-Fähigkeiten: zuerst die beginnende Seite. Gegnerische Upgrades rechts zählen für den Gegner."
        - "Die Geschwindigkeit des Gegners ist {speed}. Höhere Geschwindigkeit beginnt; bei Gleichstand beginnt euer Herausforderer."
    confirms:
      en: ["Confirm: Challenger sent", "Confirm: Upgrades revealed", "Confirm: effects resolved"]
      de: ["Bestätigen: Herausforderer geschickt", "Bestätigen: Upgrades aufgedeckt", "Bestätigen: Effekte abgehandelt"]
    why:
      en: "When the enemy is Champion, the players do not choose SKIP or FIGHT. They pick one Titan from any bench."
      de: "Ist der Gegner Champion, wählen die Spieler nicht PASSEN oder KÄMPFEN. Sie wählen einen Titan von einer beliebigen Bank."
    primary: [[{en: "Enemy starts", de: "Gegner beginnt"}, "set_starter", {side: enemy}], [{en: "We start", de: "Wir beginnen"}, "set_starter", {side: players}]]
    refs: [[{en: "Co-op: Phase 1", de: "Koop: Phase 1"}, "design/final-titan-coop-rules.md"]]
  fight_start_challenger:
    actor: players
    short:
      en: "{enemy} challenges your Champion. Play Upgrades, then pick who starts."
      de: "{enemy} fordert euren Champion heraus. Spielt Upgrades und wählt dann, wer beginnt."
    lines:
      en:
        - "{enemy} enters as enemy Challenger against your Champion."
        - "All players may play Upgrade cards face down for your Champion, then reveal them together."
        - "Resolve When Revealed effects, then Start of Fight abilities: the starting side first. Enemy Upgrades on the right count for the enemy."
        - "Enemy Speed is {speed}. Higher Speed starts; on a tie, the enemy Challenger starts."
      de:
        - "{enemy} tritt als gegnerischer Herausforderer gegen euren Champion an."
        - "Alle Spieler dürfen Upgrade-Karten verdeckt für euren Champion spielen und sie dann gemeinsam aufdecken."
        - "Handelt „Beim Aufdecken“-Effekte ab, dann „Kampfbeginn“-Fähigkeiten: zuerst die beginnende Seite. Gegnerische Upgrades rechts zählen für den Gegner."
        - "Die Geschwindigkeit des Gegners ist {speed}. Höhere Geschwindigkeit beginnt; bei Gleichstand beginnt der gegnerische Herausforderer."
    confirms:
      en: ["Confirm: ready to fight", "Confirm: Upgrades revealed", "Confirm: effects resolved"]
      de: ["Bestätigen: bereit zum Kampf", "Bestätigen: Upgrades aufgedeckt", "Bestätigen: Effekte abgehandelt"]
    why:
      en: "Your Champion stays in the arena with its current Life. The next enemy in the queue challenges it."
      de: "Euer Champion bleibt mit seinen aktuellen Lebenspunkten in der Arena. Der nächste Gegner in der Reihe fordert ihn heraus."
    primary: [[{en: "Enemy starts", de: "Gegner beginnt"}, "set_starter", {side: enemy}], [{en: "We start", de: "Wir beginnen"}, "set_starter", {side: players}]]
    refs: [[{en: "Co-op: Phase 1", de: "Koop: Phase 1"}, "design/final-titan-coop-rules.md"]]
  enemy_turn:
    actor: enemy
    short: ""
    lines:
      en:
        - "Resolve any start-of-turn abilities on {enemy} and the enemy Upgrades."
        - "Roll one die for the enemy for each of its Actions ({actions} this turn)."
        - "Look each result up on {enemy}'s Attack Chart and resolve it against your Titan."
        - "{dice_line}"
        - "Rolled Charge? Flip the Charge token with the Charge switch below the enemy card and take another Action. If it was already flipped, resolve the Ultimate, then turn it back to gray."
        - "If a card makes the enemy decide, choose what is best for the enemy."
      de:
        - "Handelt Zugbeginn-Fähigkeiten von {enemy} und den gegnerischen Upgrades ab."
        - "Würfelt für jede Aktion des Gegners einen Würfel ({actions} in diesem Zug)."
        - "Schlagt jedes Ergebnis in den Angriffswerten von {enemy} nach und handelt es gegen euren Titan ab."
        - "{dice_line}"
        - "Wut gewürfelt? Dreht den Wut-Token mit dem Schalter unter der Gegnerkarte um und führt eine weitere Aktion aus. War er schon umgedreht, handelt den Ultimate ab und stellt ihn dann wieder auf grau."
        - "Muss der Gegner laut einer Karte entscheiden, wählt das, was für den Gegner am besten ist."
    why:
      en: "The app never rolls dice and does not need the result. You only enter what it has to track: Life, tokens, and Charge."
      de: "Die App würfelt nie und braucht das Ergebnis nicht. Ihr gebt nur ein, was sie verfolgen muss: Lebenspunkte, Token und Wut."
    primary: [[{en: "End enemy turn", de: "Gegnerzug beenden"}, "end_turn", {}]]
    refs: [[{en: "Co-op: Enemy-Team Clarifications", de: "Koop: Klarstellungen zum Gegnerteam"}, "design/final-titan-coop-rules.md"]]
  players_turn:
    actor: players
    short: ""
    lines:
      en:
        - "Your turn: play it on the table as usual."
        - "Enter everything that affects the enemy with the controls below: damage, healing, tokens, or a fight end."
      de:
        - "Euer Zug: Spielt ihn wie gewohnt am Tisch."
        - "Gebt alles, was den Gegner betrifft, mit den Bedienelementen unten ein: Schaden, Heilung, Token oder ein Kampfende."
    why:
      en: "Damage you enter is reduced by the enemy's Armor, then Dodge and Minion apply automatically. Add your own Power tokens as bonus."
      de: "Eingegebener Schaden wird um die Rüstung des Gegners verringert, danach wirken Ausweichen und Diener automatisch. Eure eigenen Stärke-Token gebt ihr als Bonus ein."
    primary: [[{en: "End our turn", de: "Unseren Zug beenden"}, "end_turn", {}]]
  cleanup_enemy_defeated:
    actor: all
    short:
      en: "{enemy} is defeated. The winning player draws 1 Upgrade."
      de: "{enemy} ist besiegt. Der siegreiche Spieler zieht 1 Upgrade."
    lines:
      en:
        - "{enemy} is defeated!"
        - "**Reward:** the player whose Titan won draws 1 Upgrade card. {legendary_line}"
        - "**Your Titan** stays as Champion with its current Life."
        - "**Clean up:** remove its Fire tokens, turn its Charge gray, discard the played Upgrades."
        - "{next_line}"
      de:
        - "{enemy} ist besiegt!"
        - "**Belohnung:** Der Spieler, dessen Titan gewonnen hat, zieht 1 Upgrade-Karte. {legendary_line}"
        - "**Euer Titan** bleibt mit seinen aktuellen Lebenspunkten Champion."
        - "**Aufräumen:** Entfernt seine Feuer-Token, stellt seine Wut auf grau und werft die gespielten Upgrades ab."
        - "{next_line}"
    primary: [[{en: "Continue", de: "Weiter"}, "advance_fight", {}]]
    refs: [[{en: "Fight Clean-up", de: "Aufräumen nach dem Kampf"}, "design/rules.md"]]
  cleanup_player_defeated:
    actor: all
    short:
      en: "Your Titan is defeated. {left} of {total} Titans left."
      de: "Euer Titan ist besiegt. {left} von {total} Titanen übrig."
    lines:
      en:
        - "Your Titan is defeated."
        - "**Discard** it with its tokens and played Upgrades. **{left} of {total}** Titans left."
        - "**{enemy}** stays as enemy Champion with its current Life. Its Fire tokens are removed and its Charge turns gray."
        - "{next_line}"
      de:
        - "Euer Titan ist besiegt."
        - "**Werft ihn ab** mit seinen Token und gespielten Upgrades. **{left} von {total}** Titanen übrig."
        - "**{enemy}** bleibt mit seinen aktuellen Lebenspunkten gegnerischer Champion. Seine Feuer-Token werden entfernt und seine Wut wird grau."
        - "{next_line}"
    primary: [[{en: "Continue", de: "Weiter"}, "advance_fight", {}]]
    refs: [[{en: "Fight Clean-up", de: "Aufräumen nach dem Kampf"}, "design/rules.md"]]
  cleanup_both_defeated:
    actor: all
    short:
      en: "Both Titans are defeated. Nobody gets a reward."
      de: "Beide Titanen sind besiegt. Niemand erhält eine Belohnung."
    lines:
      en:
        - "Both Titans are defeated!"
        - "**Discard** your Titan and the played Upgrades. Nobody draws a reward."
        - "**{left} of {total}** Titans left."
        - "{next_line}"
      de:
        - "Beide Titanen sind besiegt!"
        - "**Werft** euren Titan und die gespielten Upgrades **ab**. Niemand zieht eine Belohnung."
        - "**{left} von {total}** Titanen übrig."
        - "{next_line}"
    primary: [[{en: "Continue", de: "Weiter"}, "advance_fight", {}]]
    refs: [[{en: "Simultaneous Defeat", de: "Gleichzeitige Niederlage"}, "design/rules.md"]]
  cleanup_enemy_returned:
    actor: all
    short:
      en: "{enemy} returned to its bench. You win the fight."
      de: "{enemy} ist auf seine Bank zurückgekehrt. Ihr gewinnt den Kampf."
    lines:
      en:
        - "{enemy} returned to its bench!"
        - "It heals to full Life. **Reward:** the player whose Titan stayed draws 1 Upgrade card."
        - "**Next:** {enemy} fights again. No enemy Upgrade is revealed."
      de:
        - "{enemy} ist auf seine Bank zurückgekehrt!"
        - "Er heilt sich vollständig. **Belohnung:** Der Spieler, dessen Titan geblieben ist, zieht 1 Upgrade-Karte."
        - "**Als Nächstes:** {enemy} kämpft erneut. Es wird kein gegnerisches Upgrade aufgedeckt."
    primary: [[{en: "Continue", de: "Weiter"}, "advance_fight", {}]]
    refs: [[{en: "Returning to the Bench", de: "Rückkehr auf die Bank"}, "design/rules.md"]]
  cleanup_player_returned:
    actor: all
    short:
      en: "Your Titan returned to its bench. The enemy wins the fight."
      de: "Euer Titan ist auf seine Bank zurückgekehrt. Der Gegner gewinnt den Kampf."
    lines:
      en:
        - "Your Titan returned to its bench."
        - "It heals to full Life. **{enemy}** wins and stays as enemy Champion."
        - "{next_line}"
      de:
        - "Euer Titan ist auf seine Bank zurückgekehrt."
        - "Er heilt sich vollständig. **{enemy}** gewinnt und bleibt gegnerischer Champion."
        - "{next_line}"
    primary: [[{en: "Continue", de: "Weiter"}, "advance_fight", {}]]
    refs: [[{en: "Returning to the Bench", de: "Rückkehr auf die Bank"}, "design/rules.md"]]
  victory:
    actor: all
    short:
      en: "Victory!"
      de: "Sieg!"
    lines:
      en:
        - "Every enemy Titan is defeated. You win together!"
      de:
        - "Alle gegnerischen Titanen sind besiegt. Ihr gewinnt gemeinsam!"
  defeat:
    actor: all
    short:
      en: "Defeat."
      de: "Niederlage."
    lines:
      en:
        - "All your Titans are defeated. The enemy wins this time."
      de:
        - "Alle eure Titanen sind besiegt. Diesmal gewinnt der Gegner."
