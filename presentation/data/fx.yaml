# Generic taunts from the enemy team; never card specific.
taunts:
  en:
    whiff: ["Is that all you've got?", "Missed me!", "Too slow!"]
    hit_small: ["That tickles.", "Hmph."]
    dodge: ["Too slow!", "Over here!"]
    minion: ["Not today!", "My minions have my back."]
    start_turn: ["My turn!", "Brace yourselves!", "Now you'll see!"]
    ultimate: ["Behold my true power!", "This ends now!"]
    player_lost: ["Next!", "Who's next?", "Another one falls!"]
    fight: ["Let's dance!", "You again?"]
    roll_power: ["Feel my power!", "Here it comes!"]
    roll_miss: ["...that was a warm-up.", "Just getting started."]
  de:
    whiff: ["Ist das alles?", "Daneben!", "Zu langsam!"]
    hit_small: ["Das kitzelt.", "Pah."]
    dodge: ["Zu langsam!", "Hier drüben!"]
    minion: ["Heute nicht!", "Meine Diener halten zu mir."]
    start_turn: ["Jetzt bin ich dran!", "Macht euch bereit!", "Jetzt seht ihr was!"]
    ultimate: ["Seht meine wahre Macht!", "Jetzt ist Schluss!"]
    player_lost: ["Der Nächste!", "Wer ist der Nächste?", "Wieder einer weniger!"]
    fight: ["Auf in den Tanz!", "Ihr schon wieder?"]
    roll_power: ["Spürt meine Kraft!", "Jetzt kommt's!"]
    roll_miss: ["...das war nur das Aufwärmen.", "Ich fange ja erst an."]

# The Attack Chart icons on a Titan card, as fractions of the card image width (y too, so it holds for every card
# height): column centers left to right, the vertical center, and the radius of the icon.
chart_icons:
  x: [0.618, 0.7195, 0.823, 0.9265]
  y: 0.6985
  r: 0.0405

# Bright outline color of the glow per die face.
die_glow:
  blue: "#4CC3FF"
  green: "#46F28A"
  yellow: "#FFE14D"
  red: "#FF5964"
  charge: "#FFD400"
  miss: "#9A96A0"
