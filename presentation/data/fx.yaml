# Sound-effect words per language, damage tiers, durations, and enemy taunts for the presentation layer.
# Damage tier by minimum damage, checked top to bottom: drives the word, shake, knockback, hit-stop, and particles.
damage_tiers:
  - [5, 3]
  - [3, 2]
  - [1, 1]

words:
